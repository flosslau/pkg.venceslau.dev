# see https://golangci-lint.run/usage/configuration/
version: "2"

linters:
  enable:
    - wrapcheck
    - dupl
    - errorlint
    - errname
    - goconst
    - gosec
    - unconvert
    - unparam
    - wastedassign
    - whitespace
    - lll
  exclusions:
    rules:
      # Exclude some linters from running on tests files.
      - path: _test\.go
        linters:
          - lll
          - gosec
          - dupl

# see https://golangci-lint.run/usage/configuration/
version: "2"

linters:
  enable:
    - wrapcheck
    - dupl
    - errorlint
    - errname
    - goconst
    - gosec
    - unconvert
    - unparam
    - wastedassign
    - whitespace
    - lll
    # Every nolint names its linter and says why.
    - nolintlint
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    rules:
      # Exclude some linters from running on tests files. goconst: the
      # values in test tables repeat by design, and each row reads better
      # with the value than with a name.
      - path: _test\.go
        linters:
          - lll
          - gosec
          - dupl
          - goconst

name: CI

# Checks only. Cloudflare's Git integration builds and deploys the site, so
# this workflow has no deploy step and reads no secret.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # One job per gate of the Makefile, named after it; the ruleset of main
  # requires these names, and TestCIRunsEveryGate keeps the list equal to
  # GATES in the Makefile.
  gate:
    name: ${{ matrix.gate }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gate: [gofmt, reuse, vet, test, site, lint]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - run: make "$GATE"
        env:
          GATE: ${{ matrix.gate }}

# Proposes updates of the actions the workflows pin by commit. The tools CI
# installs are pinned in mise.toml and mise.lock, which Dependabot does not
# read.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
